<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NammadaBus.in</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ff2e4d">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- APP HEADER -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="bus-emoji">🚌</span>
                <h1>NammadaBus<span>.in</span></h1>
            </div>
            <p id="appTagline" class="tagline">നമ്മുടെ സ്വന്തം ബസ് സമയവിവരങ്ങൾ</p>
        </div>
        <button id="langToggleBtn" class="lang-floating-btn">English</button>
    </header>

    <main class="app-container">
        <!-- LIVE LOCATION SHARE BUTTON -->
        <div class="live-share-wrapper">
            <button id="liveShareBtn" class="live-share-btn">
                <span class="pulse-dot"></span> 🟢 Live Location Share ലഭ്യമാണ്
            </button>
        </div>

        <!-- SEARCH CONTAINER -->
        <div class="search-wrapper">
            <input type="text" id="busSearchInput" placeholder="ബസ് പേര് അല്ലെങ്കിൽ റൂട്ട് ടൈപ്പ് ചെയ്യുക...">
        </div>

        <!-- STARTING POINT SELECTOR -->
        <div class="selector-card">
            <label id="startLabel" class="field-title">നിങ്ങൾ ഇപ്പോൾ എവിടെയാണ്? (Starting Point)</label>
            <div class="segmented-control">
                <button class="segment-btn active" data-value="chelliparamba">ചെല്ലിപ്പറമ്പ് / ചെമ്പേരി</button>
                <button class="segment-btn" data-value="kuthuparamba">കൂത്തുപറമ്പ് / കണ്ണൂർ</button>
            </div>
        </div>

        <!-- DESTINATION SCROLLABLE CHIPS -->
        <div class="destination-wrapper">
            <label id="destLabel" class="field-title">ഏത് ഭാഗത്തേക്കാണ് പോകേണ്ടത്? (Destination)</label>
            <div id="routeButtonsContainer" class="horizontal-scroll-chips">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- TIME RANGE TOGGLE VIEW BUTTON -->
        <div class="toggle-container">
            <button id="toggleBusesBtn" class="toggle-view-btn">എല്ലാ സമയത്തെയും ബസ്സുകൾ കാണിക്കുക</button>
        </div>

        <!-- BUS TIMELINE CONTAINER -->
        <section class="results-section" id="busListContainer">
            <!-- Bus cards generated automatically via JavaScript -->
        </section>
    </main>

    <!-- FLOATING SUGGESTIONS/FEEDBACK BUTTON -->
    <button id="feedbackOpenBtn" class="feedback-floating-btn">
        <span class="chat-icon">💬</span> Suggestions
    </button>

    <!-- MODAL POPUPS -->
    <div id="feedbackModal" class="modal-overlay">
        <div class="modal-card">
            <button id="modalCloseBtn" class="modal-close">&times;</button>
            <h3 id="modalTitle">നിങ്ങളുടെ നിർദ്ദേശങ്ങൾ അറിയിക്കൂ</h3>
            <textarea id="modalTextarea" placeholder="എന്തെങ്കിലും മാറ്റങ്ങൾ ഉണ്ടെങ്കിൽ റൂട്ടും സമയവും ഇവിടെ എഴുതുക..."></textarea>
            <button id="modalSubmitBtn" class="modal-submit">Submit</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>© 2026 NammadaBus.in</p>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
