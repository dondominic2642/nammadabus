<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NammadaBus.in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="splash-screen">
        <img src="icon-192.png" alt="Logo">
    </div>

    <header class="app-header">
        <div class="logo-section">
            <i class="fa-solid fa-bus"></i>
            <h1>Nammadabus</h1>
        </div>
        <span class="live-badge">Live</span>
    </header>

    <main class="container">
        <div class="search-card">
            <input type="text" id="searchBar" placeholder="ബസ് പേര് അല്ലെങ്കിൽ റൂട്ട് സെർച്ച് ചെയ്യാം...">
        </div>

        <section class="tabs-section">
            <h2 id="sourceTitle">നിങ്ങൾ ഇപ്പോൾ എവിടെയാണ്?</h2>
            <div class="source-tabs">
                <button id="srcChelliparamba" class="src-tab active">ചെല്ലിപ്പറമ്പ് / ചെമ്പേരി</button>
                <button id="srcKuthuparamba" class="src-tab">കൂത്തുപറമ്പ് / കണ്ണൂർ</button>
            </div>

            <h2 id="destTitle">ഏത് ഭാഗത്തേക്കാണ് പോകേണ്ടത്?</h2>
            <div id="destContainer" class="dest-tabs-container"></div>
        </section>

        <div class="filter-container">
            <button onclick="filterRoute('all')" class="filter-btn active">എല്ലാം</button>
            <button onclick="filterRoute('kannur')" class="filter-btn">Kannur</button>
            <button onclick="filterRoute('taliparamba')" class="filter-btn">Taliparamba</button>
        </div>

        <section id="busList" class="bus-list">
            </section>
    </main>

    <script>
        // സ്പ്ലാഷ് സ്‌ക്രീൻ ലോജിക്
        window.addEventListener('load', function() {
            setTimeout(() => {
                let splash = document.getElementById('splash-screen');
                if (splash) splash.style.display = 'none';
            }, 2000);
        });

        // ഫിൽട്ടർ ലോജിക്
        function filterRoute(route) {
            let busCards = document.querySelectorAll('.bus-card');
            busCards.forEach(card => {
                if(route === 'all' || card.getAttribute('data-route') === route) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // സെർച്ച് ലോജിക്
        document.getElementById('searchBar').addEventListener('input', function(e) {
            let filter = e.target.value.toLowerCase();
            document.querySelectorAll('.bus-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(filter) ? "flex" : "none";
            });
        });
    </script>
</body>
</html>
