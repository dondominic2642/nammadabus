<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NammadaBus.in</title>
</head>
<body>

    <div id="splash-screen">
        <img src="icon-192.png" alt="Logo">
    </div>

    <header class="app-header">
        <h1>NammadaBus.in</h1>
        <p>നമ്മുടെ സ്വന്തം ബസ് സമയവിവരങ്ങൾ</p>
    </header>

    <main class="container">
        
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="ബസ് പേര് അല്ലെങ്കിൽ റൂട്ട് സെർച്ച് ചെയ്യാം...">
        </div>

        <section class="tabs-section">
            <h2 id="sourceTitle">നിങ്ങൾ ഇപ്പോൾ എവിടെയാണ്?</h2>
            <div class="source-tabs">
                <button id="srcChelliparamba" class="src-tab active">ചെല്ലിപ്പറമ്പ് / ചെമ്പേരി</button>
                <button id="srcKuthuparamba" class="src-tab">കൂത്തുപറമ്പ് / കണ്ണൂർ</button>
            </div>
            <h2 id="destTitle">ഏത് ഭാഗത്തേക്കാണ് പോകേണ്ടത്?</h2>
            <div id="destContainer" class="dest-tabs-container"></div>
        </section>

        <section id="busList" class="bus-list">
        </section>

        <button id="openFeedbackBtn" class="feedback-trigger-btn">💬 Suggestions</button>
    </main>

    <script>
        // സ്പ്ലാഷ് സ്‌ക്രീൻ ലോജിക്
        window.addEventListener('load', function() {
            setTimeout(() => {
                let splash = document.getElementById('splash-screen');
                if (splash) splash.style.display = 'none';
            }, 2000);
        });

        // അലാറം ഫങ്ക്ഷനുകൾ
        function speakAlarm(busName, minutes, language) {
            let message = (language === 'ml') 
                ? `${busName} ബസ് ${minutes} മിനിറ്റിനുള്ളിൽ എത്തും.` 
                : `Attention, ${busName} bus will arrive in ${minutes} minutes.`;
            
            let speech = new SpeechSynthesisUtterance(message);
            speech.lang = (language === 'ml') ? 'ml-IN' : 'en-US';
            window.speechSynthesis.speak(speech);
        }

        function triggerAlarm(busName, minutes, language) {
            if (Notification.permission === "granted") {
                new Notification("Nammadabus Alert!", {
                    body: (language === 'ml') ? `${busName} ബസ് ${minutes} മിനിറ്റിനുള്ളിൽ!` : `${busName} bus in ${minutes} mins`
                });
            }
            speakAlarm(busName, minutes, language);
        }

        function setMyAlarm(busName) {
            // ബസ് ലിസ്റ്റിൽ നിന്ന് സമയം എടുക്കുന്നു
            let minutes = document.getElementById('alarm-time').value;
            let language = document.getElementById('lang-select').value;
            triggerAlarm(busName, minutes, language);
        }

        // പെർമിഷൻ ചോദിക്കുന്നു
        if ("Notification" in window) Notification.requestPermission();
    </script>
</body>
</html>
