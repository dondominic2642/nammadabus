<!DOCTYPE html>
<html lang="ml">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PHQ8GQDMMQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PHQ8GQDMMQ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nammadabus - Chemperi Bus Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Splash Screen Style */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }
        .ripple-container { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; }
        .bus-logo { width: 80px; z-index: 2; }
        .circle { position: absolute; width: 100px; height: 100px; border: 3px solid #ffcc00; border-radius: 50%; animation: ripple 2s linear infinite; z-index: 1; }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="ripple-container">
            <div class="circle"></div>
            <img src="icon-192.png" alt="Logo" class="bus-logo">
        </div>
    </div>

    <header class="app-header">
        <h1>NammadaBus.in</h1>
        <div class="lang-switch">
            <button onclick="changeLang('ml')">മലയാളം</button> | <button onclick="changeLang('en')">English</button>
        </div>
    </header>

    <main class="container">
        <div class="search-container">
            <input type="text" id="busSearchInput" placeholder="ബസ് പേര് അല്ലെങ്കിൽ റൂട്ട് സെർച്ച് ചെയ്യാം...">
        </div>

        <section class="tabs-section">
            <h2 id="sourceTitle">നിങ്ങൾ ഇപ്പോൾ എവിടെയാണ്?</h2>
            <div class="source-tabs">
                <button class="src-tab active" onclick="selectSource('Chelliparamba')">ചെല്ലിപ്പറമ്പ് / ചെമ്പേരി</button>
                <button class="src-tab" onclick="selectSource('Kuthuparamba')">கூത്തുപറമ്പ് / കണ്ണൂർ</button>
            </div>
            <div id="destContainer" class="dest-tabs-container"></div>
        </section>

        <section id="busList" class="bus-list">
            <!-- ബസ് ലിസ്റ്റ് ഇവിടെ ലോഡ് ആകുന്നു -->
        </section>

        <button id="openFeedbackBtn" class="feedback-trigger-btn" onclick="openFeedback()">💬 Suggestions</button>
    </main>

    <!-- Script Section -->
    <script>
        // Splash Screen Logic (2 seconds)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) splash.style.display = 'none';
            }, 2000);
        });

        // Search Logic
        document.getElementById('busSearchInput').addEventListener('input', function(e) {
            let filter = e.target.value.toLowerCase();
            document.querySelectorAll('.bus-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(filter) ? "flex" : "none";
            });
        });

        // Feedback
        function openFeedback() { window.location.href = "mailto:your-email@example.com?subject=Suggestions"; }
        
        // Language placeholder
        function changeLang(lang) { 
            console.log("Language changed to: " + lang); 
            if(typeof renderBuses === "function") renderBuses(); 
        }
    </script>

    <!-- Connect your app logic -->
    <script src="app.js"></script>
</body>
</html>
